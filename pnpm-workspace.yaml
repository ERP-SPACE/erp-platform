packages:
  - "apps/*"
  - "packages/*"
# Only build tools may run install scripts; telemetry and optional native helpers stay off.
allowBuilds:
  "@scarf/scarf": false
  "@swc/core": true
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - "@swc/core-darwin-arm64@1.16.20"
  - "@swc/core-darwin-x64@1.16.20"
  - "@swc/core-linux-arm-gnueabihf@1.16.20"
  - "@swc/core-linux-arm64-gnu@1.16.20"
  - "@swc/core-linux-arm64-musl@1.16.20"
  - "@swc/core-linux-ppc64-gnu@1.16.20"
  - "@swc/core-linux-s390x-gnu@1.16.20"
  - "@swc/core-linux-x64-gnu@1.16.20"
  - "@swc/core-linux-x64-musl@1.16.20"
  - "@swc/core-win32-arm64-msvc@1.16.20"
  - "@swc/core-win32-ia32-msvc@1.16.20"
  - "@swc/core-win32-x64-msvc@1.16.20"
  - "@swc/core@1.16.20"
